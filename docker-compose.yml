services:
  postgres:
    image: postgres:15
    container_name: postgres
    environment:
      POSTGRES_DB: delivery_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: 12345
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  rest-api:
    image: noemirous/proyecto_grupo1_delivery:latest
    container_name: rest-api
    env_file:
      - ./config/.env
    ports:
      - "3000:3000"
    depends_on:
      - postgres

volumes:
  pgdata:
