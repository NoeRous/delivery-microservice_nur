name: Release

on:
    push:
        branches:
            - main

jobs:
    build-and-test:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '20'
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Build
              run: npm run build

            - name: Test
              run: npm run test

    release:
        needs: build-and-test
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Login to Docker Hub
              uses: docker/login-action@v3
              with:
                  username: ${{ secrets.DOCKER_USERNAME }}
                  password: ${{ secrets.DOCKER_PASSWORD }}

            - name: Build and push Docker image
              uses: docker/build-push-action@v5
              with:
                  context: .
                  push: true
                  tags: noemirous/proyecto_grupo1_delivery:latest

            - name: Deploy to VM via SSH
              uses: appleboy/ssh-action@master
              with:
                  host: ${{ secrets.SSH_HOST }}
                  username: ${{ secrets.SSH_USERNAME }}
                  key: ${{ secrets.SSH_PRIVATE_KEY }}
                  script: |
                      cd ~/app

                      echo "Actualizando contenedores..."
                      docker-compose down
                      docker-compose pull
                      docker-compose up -d

                      echo "Despliegue finalizado exitosamente."

    monitor:
        needs: release
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Wait for services to be ready
              run: sleep 30

            - name: Health check
              run: |
                  curl -f http://${{ secrets.PROD_IP }}:${{ secrets.PROD_PORT }}/health || exit 1

            - name: Verify deployment status via SSH
              uses: appleboy/ssh-action@master
              with:
                  host: ${{ secrets.SSH_HOST }}
                  username: ${{ secrets.SSH_USERNAME }}
                  key: ${{ secrets.SSH_PRIVATE_KEY }}
                  script: |
                      echo "=== Estado de contenedores ==="
                      docker ps -a --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"

                      echo ""
                      echo "=== Uso de recursos ==="
                      docker stats rest-api --no-stream --format "table {{.Name}}\t{{.CPUPerc}}\t{{.MemUsage}}\t{{.NetIO}}"

                      echo ""
                      echo "=== Logs recientes ==="
                      docker logs rest-api --tail 30

                      echo ""
                      echo "=== Estado del contenedor ==="
                      if docker ps | grep -q rest-api; then
                          echo "OK: rest-api está corriendo"
                      else
                          echo "ERROR: rest-api no está corriendo"
                          exit 1
                      fi
